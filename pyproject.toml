[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyNISAR"
version = "0.1.0a1"
description = "NISAR L-band SAR inspection, polarimetry and reproducible geospatial products"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Cesar Alvites"}]
dependencies = [
    "numpy>=1.26", "h5py>=3.10", "rasterio>=1.3", "affine>=2.4",
    "earthaccess>=0.15,<1", "geopandas>=1.0", "pandas>=2",
    "matplotlib>=3.8", "ipython>=8", "nbformat>=5",
]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
notebook = ["ipython>=8", "nbformat>=5"]
discovery = ["earthaccess>=0.15,<1", "geopandas>=1.0"]
decompositions = ["polsartools==0.11"]
dev = ["pytest>=8", "build", "twine"]

[project.scripts]
pynisar = "pynisar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynisar = ["data/*/*.json", "data/*/*.npz", "data/*/*.tif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
